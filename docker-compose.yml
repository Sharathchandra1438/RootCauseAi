services:
  shop-db:
    image: postgres:16
    container_name: shop-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - shop-db-data:/var/lib/postgresql/data

volumes:
  shop-db-data:
